name: linux

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read  #  to fetch code (actions/checkout)
  actions: read  #  to query GitHub Actions cache usage

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: "on"
    steps:

    - uses: actions/checkout@v6

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.10
      with:
        version: "v0.14.0"

    # The build fetches the rest, zstd included, but not the test dependencies.
    - name: Install dependencies
      run: >
        sudo apt-get update &&
        sudo apt-get install -y libgtest-dev

    - name: Configure
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DTHRIFT_TESTS=ON
        -DCMAKE_C_COMPILER_LAUNCHER=sccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

    # A bare -j starts every ready compile at once, which on a cold cache
    # exhausts the runner's memory.
    - name: Build
      run: cmake --build build -j "$(nproc)"

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - name: Show sccache stats
      if: always()
      run: sccache --show-stats
